[project]
name = "unturtle-flm"
version = "0.0.1"
description = "FLM/FMLM (Flow Map Language Models, arXiv:2602.16813) reference method pack for Unturtle - EXPERIMENTAL (#155: checkpoint parity + generation/evaluation only, no training)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
# torch / transformers / flash-attn / huggingface_hub are supplied by the
# host Unturtle environment; the pack pins no deep-learning deps so it can
# never downgrade the host's CUDA-matched builds.
dependencies = []

[project.entry-points."unturtle.plugins"]
flm = "unturtle_flm:register_unturtle"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
